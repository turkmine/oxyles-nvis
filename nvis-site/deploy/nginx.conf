# Nginx-конфиг для страницы Nvis.
# Проверено на nginx 1.24. Положить в /etc/nginx/sites-available/nvis,
# сделать симлинк в sites-enabled и перезагрузить nginx.
#
# Политика безопасности отдаётся заголовками, а не через <meta http-equiv>:
# только так работает frame-ancestors и только так браузер не применяет
# правила к служебным запросам вроде robots.txt.

server {
    listen 80;
    listen [::]:80;
    server_name nvis-site.turkmine3456.workers.dev;

    # ACME-челлендж для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nvis-site.turkmine3456.workers.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nvis-site.turkmine3456.workers.dev;

    root /var/www/nvis-site;
    index index.html;
    charset utf-8;

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/nvis-site.turkmine3456.workers.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvis-site.turkmine3456.workers.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- Заголовки безопасности ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Источник — только сам домен. 'unsafe-inline' не нужен:
    # на странице нет ни инлайновых скриптов, ни инлайновых стилей.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ---------- Сжатие ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    # ---------- Установщик ----------
    # Отдаём как вложение, чтобы браузер не пытался открыть его
    # как страницу, и сразу отдаём на скачивание большими кусками.
    location ~ ^/downloads/(?<installer>[^/]+\.msi)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Disposition "attachment; filename=\"$installer\"" always;
        add_header Content-Type "application/x-msi" always;
        types { }
        default_type application/x-msi;
        sendfile on;
        tcp_nopush on;
        try_files $uri =404;
    }

    # ---------- Кэш ----------
    # HTML проверяем каждый раз, статику держим долго.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Лишние файлы наружу не отдаём
    location ~ /\.(?!well-known) {
        deny all;
    }
}